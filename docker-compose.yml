services:
  db:
    image: postgres:16-alpine
    container_name: opa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opa
      POSTGRES_PASSWORD: opa_dev_password
      POSTGRES_DB: opa
    ports:
      - "5432:5432"
    volumes:
      - opa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opa -d opa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opa_db_data:
